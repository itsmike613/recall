<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <!-- Meta -->
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="RECALL" property="og:title">
    <meta content="See it. Remember it. Rebuild it." property="og:description">
    <meta content="https://itsmike613.github.io/recall/" property="og:url">
    <meta content="https://github.com/itsmike613/recall/blob/main/Source/Images/logo.png?raw=true" property="og:image">
    <meta content="#315C4B" data-react-helmet="true" name="theme-color">

    <!-- Tab -->
    <link rel="icon" type="image/x-icon" href="Source/Images/logo.png">
    <title>RECALL</title>

    <!-- Styles -->
    <link rel="stylesheet" href="Source/Styles/index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js" defer></script>
</head>

<body>
    <header class="bar">
        <button class="brand" data-go="home" aria-label="Home">
            <img src="Source/Images/logo.png" alt="">
            <span data-title></span>
        </button>
        <div class="tools">
            <button class="tool" id="theme" aria-label="Theme"><i class="ph ph-sun"></i><span>LM</span></button>
            <button class="tool" id="lang" aria-label="Language"><i class="ph ph-globe"></i><span>EN</span></button>
        </div>
    </header>

    <main class="shell">
        <section class="page active" id="home">
            <div class="hero">
                <img class="mark" src="Source/Images/logo.png" alt="">
                <h1 data-logo></h1>
                <p data-t="tagline"></p>
                <div class="stack">
                    <button class="primary" data-go="setup" data-t="play"></button>
                    <button data-go="settings" data-t="settings"></button>
                    <button data-go="help" data-t="help"></button>
                </div>
            </div>
        </section>

        <section class="page" id="setup">
            <div class="head">
                <div>
                    <p class="eyebrow" data-t="newround"></p>
                    <h2 data-t="setup"></h2>
                </div>
                <button class="icon" data-go="home" aria-label="Home"><i class="ph ph-x"></i></button>
            </div>
            <div class="panel" id="cats"></div>
            <div class="sum"><span data-t="total"></span><strong id="total">0 / 9</strong></div>
            <p class="notice" id="setupnote"></p>
            <div class="actions"><button data-go="home" data-t="back"></button><button class="primary" id="generate" data-t="generate"></button></div>
        </section>

        <section class="page" id="preview">
            <div class="head">
                <div>
                    <p class="eyebrow" data-t="generated"></p>
                    <h2 data-t="preview"></h2>
                </div>
            </div>
            <div class="room" data-room="preview"></div>
            <p class="notice" id="previewnote"></p>
            <div class="actions three"><button data-go="setup" data-t="back"></button><button id="reroll" data-t="reroll"></button><button class="primary" id="begin" data-t="startstudy"></button></div>
        </section>

        <section class="page" id="study">
            <div class="head">
                <div>
                    <p class="eyebrow" data-t="phase1"></p>
                    <h2 data-t="study"></h2>
                </div>
                <div class="clock" id="studyclock">00:30</div>
            </div>
            <div class="progress"><span id="studybar"></span></div>
            <div class="room" data-room="study"></div>
            <div class="actions"><button id="redo" data-t="redo"></button><button class="primary" id="studyskip" data-t="skip"></button></div>
        </section>

        <section class="page" id="wait">
            <div class="head">
                <div>
                    <p class="eyebrow" data-t="phase2"></p>
                    <h2 data-t="wait"></h2>
                </div>
                <div class="clock" id="waitclock">00:30</div>
            </div>
            <div class="progress"><span id="waitbar"></span></div>
            <div class="waitbox">
                <p data-t="waittext"></p>
                <div class="task hidden" id="task"></div>
                <p class="warning"><i class="ph ph-warning"></i><span data-t="warning"></span></p>
            </div>
            <div class="actions"><button id="quit" data-t="quit"></button><button class="primary" id="waitskip" data-t="skip"></button></div>
        </section>

        <section class="page" id="recognition">
            <div class="head">
                <div>
                    <p class="eyebrow" data-t="phase3"></p>
                    <h2 data-t="recognition"></h2>
                </div>
                <div class="count" id="pickcount">0 / 0</div>
            </div>
            <p class="lead" id="picklead"></p>
            <div class="tray" id="tray"></div>
            <div class="actions end"><button class="primary" id="pickdone" data-t="done"></button></div>
        </section>

        <section class="page" id="details">
            <div class="head">
                <div>
                    <p class="eyebrow" data-t="phase4"></p>
                    <h2 data-t="features"></h2>
                </div>
                <div class="count" id="detailcount">0 / 0</div>
            </div>
            <p class="lead" data-t="featurelead"></p>
            <div class="details" id="detailtray"></div>
            <div class="actions end"><button class="primary" id="detaildone" data-t="done"></button></div>
        </section>

        <section class="page" id="location">
            <div class="head">
                <div>
                    <p class="eyebrow" data-t="phase5"></p>
                    <h2 data-t="location"></h2>
                </div>
                <div class="count" id="placecount">0 / 0</div>
            </div>
            <p class="lead" data-t="placelead"></p>
            <div class="recall">
                <div class="objects" id="objects"></div>
                <div class="room reconstruct" id="reconstruct"></div>
            </div>
            <div class="actions end"><button class="primary" id="placedone" data-t="done"></button></div>
        </section>

        <section class="page" id="results">
            <div class="head">
                <div>
                    <p class="eyebrow" data-t="complete"></p>
                    <h2 data-t="results"></h2>
                </div>
            </div>
            <div class="results" id="scores"></div>
            <div class="actions"><button data-go="home" data-t="home"></button><button class="primary" data-go="setup" data-t="again"></button></div>
        </section>

        <section class="page" id="settings">
            <div class="head">
                <div>
                    <p class="eyebrow" data-t="preferences"></p>
                    <h2 data-t="settings"></h2>
                </div><button class="icon" data-go="home" aria-label="Home"><i class="ph ph-x"></i></button>
            </div>
            <div class="panel settings">
                <label class="setting"><span><b data-t="images"></b><small data-t="imageshelp"></small></span><input type="checkbox" id="images" checked></label>
                <label class="setting"><span><b data-t="detailed"></b><small data-t="detailedhelp"></small></span><input type="checkbox" id="detailed"></label>
                <label class="setting"><span><b data-t="studytime"></b><small data-t="timerhelp"></small></span><span class="number"><input type="number" id="studytime" min="1" max="600" step="1" value="30"><em data-t="seconds"></em></span></label>
                <label class="setting"><span><b data-t="waittime"></b><small data-t="timerhelp"></small></span><span class="number"><input type="number" id="waittime" min="1" max="600" step="1" value="30"><em data-t="seconds"></em></span></label>
                <label class="setting"><span><b data-t="distraction"></b><small data-t="distractionhelp"></small></span><input type="checkbox" id="distraction"></label>
                <div class="setting"><span><b data-t="directions"></b><small data-t="directionshelp"></small></span><button class="choice" id="directions"></button>
                </div>
            </div>
        </section>

        <section class="page" id="help">
            <div class="head">
                <div>
                    <p class="eyebrow" data-t="guide"></p>
                    <h2 data-t="help"></h2>
                </div><button class="icon" data-go="home" aria-label="Home"><i class="ph ph-x"></i></button>
            </div>
            <div class="help" id="helpcopy"></div>
        </section>
    </main>

    <!-- Body Scripts -->
    <script src="Source/Data/index.js"></script>
    <script src="Source/Scripts/index.js"></script>
</body>

</html>
